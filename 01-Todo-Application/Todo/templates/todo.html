{% load static %}
<!DOCTYPE html>
<html>
<head><title>My Todo</title><link rel="stylesheet" href="{% static 'css/index.css' %}"></head>
<body>
<div class="card" style="width: 400px;">
    <h2>Hello {{ user.username }}! 📝</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title" placeholder="New task..." required>
        <button type="submit">Add Task</button>
    </form>
    <hr>
    {% for t in todos %}
        <p>✅ {{ t.title }}</p>
    {% empty %}
        <p>No tasks yet</p>
    {% endfor %}
    <br>
    <a href="/logout/">Logout</a>
</div>
</body>
</html>
