{% extends 'blog/base.html' %}
{% block content %}
<h2 class="mb-4">Latest Posts</h2>
<div class="row">
{% for post in posts %}
<div class="col-md-4 mb-3">
  <div class="card">
    {% if post.image %}
    <img src="{{ post.image.url }}" class="card-img-top" style="height:200px;object-fit:cover">
    {% endif %}
    <div class="card-body">
      <h5>{{ post.title }}</h5>
      <p class="text-muted">{{ post.category.name }} | {{ post.created_at|date:"M d, Y" }}</p>
      <a href="{% url 'post_detail' post.slug %}" class="btn btn-primary btn-sm">Read More</a>
    </div>
  </div>
</div>
{% empty %}
<p>No posts yet. Go to Admin and add!</p>
{% endfor %}
</div>
{% endblock %}
